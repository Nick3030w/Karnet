<ion-content class="login-content">
  <div class="login-wrapper">

    <!-- Logo y encabezado -->
    <div class="login-header">
      <!-- K geométrica multicolor inspirada en el logo institucional -->
      <svg class="kl-logo-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <!-- Columna vertical izquierda (magenta + morado) -->
        <polygon points="10,10 30,10 30,40 10,40" fill="#E8006F"/>
        <polygon points="10,40 30,40 30,70 10,70" fill="#6B2D8B"/>
        <!-- Brazo superior derecho (verde limón) -->
        <polygon points="30,10 70,10 50,40 30,40" fill="#A8C800"/>
        <!-- Brazo inferior derecho (teal) -->
        <polygon points="30,40 50,40 70,70 30,70" fill="#3A8A8A"/>
        <!-- Triángulo central oscuro (intersección) -->
        <polygon points="30,25 45,40 30,40" fill="#4a1a6b" opacity="0.5"/>
      </svg>

      <h1 class="university-name">Konrad Lorenz</h1>
      <p class="university-subtitle">Fundación Universitaria</p>
    </div>

    <!-- Formulario -->
    <div class="login-form">

      <label class="field-label">Correo institucional</label>
      <ion-item class="form-item" lines="none">
        <ion-input
          type="email"
          [(ngModel)]="email"
          placeholder="usuario@konradlorenz.edu.co"
          autocomplete="email"
          [disabled]="loading">
        </ion-input>
      </ion-item>

      <label class="field-label">Contraseña</label>
      <ion-item class="form-item" lines="none">
        <ion-input
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [disabled]="loading"
          (keyup.enter)="onLogin()">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        class="login-btn"
        (click)="onLogin()"
        [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
        }
        {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
      </ion-button>

    </div>

    <!-- Credenciales de prueba -->
    <div class="demo-hint">
      <p><strong>Demo:</strong> nicolas.espitia&#64;konradlorenz.edu.co / 123456</p>
      <p><strong>Admin:</strong> admin&#64;konradlorenz.edu.co / admin123</p>
    </div>

  </div>
</ion-content>
